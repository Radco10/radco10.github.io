<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RADCO Payment Certificate Viewer</title>
<style>
  :root{--gold:#8A7A3E;--light:#F4F1E6;--ink:#222;--muted:#6b6b6b}
  *{box-sizing:border-box}
  body{margin:0;background:#ecebe6;font-family:Calibri,"Segoe UI",Tahoma,Arial,sans-serif;color:var(--ink)}
  .sheet{max-width:760px;margin:0 auto;background:#fff;min-height:100vh;padding:14px 16px 10px;box-shadow:0 0 18px rgba(0,0,0,.08)}
  .hdr,.ftr{width:100%;display:block}
  h1{margin:10px 0 4px;text-align:center;color:var(--gold);font-size:22px;letter-spacing:.5px;border-top:2px solid var(--gold);border-bottom:2px solid var(--gold);padding:7px 0}
  h1 span{font-weight:600}
  .badge{display:flex;justify-content:center;gap:8px;align-items:center;margin:8px 0 12px;font-size:13px;color:#2e6b2e}
  .badge b{background:#e7f3e7;border:1px solid #b9dcb9;border-radius:20px;padding:3px 12px}
  .sec{margin:12px 0 4px;color:var(--gold);font-weight:700;font-size:14px;display:flex;justify-content:space-between;border-bottom:1px solid #ddd6bd;padding-bottom:3px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  td{padding:7px 6px;border-bottom:1px solid #eee;vertical-align:top}
  td.k{width:40%;color:var(--muted);font-size:12.5px;line-height:1.3}
  td.k .ar{display:block;direction:rtl;text-align:left;font-size:12px}
  td.v{font-weight:600;word-break:break-word}
  td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  tr.total td{background:var(--light);font-size:15.5px}
  tr.net td{background:var(--gold);color:#fff;font-size:16px}
  tr.net td.k,tr.net td.k .ar{color:#fff}
  .empty{text-align:center;padding:50px 10px;color:var(--muted)}
  .empty b{display:block;color:var(--gold);font-size:18px;margin-bottom:8px}
  .err{color:#b00020}
  .copy{display:block;margin:16px auto 8px;background:#fff;border:1px solid var(--gold);color:var(--gold);border-radius:6px;padding:8px 18px;font-size:14px;cursor:pointer}
  .note{text-align:center;font-size:11px;color:#999;margin:6px 0 10px}
</style>
</head>

<script>
(function(){
  var out=document.getElementById('out');
  var AL="abcdefghijklmnopqrstuvwxyz234567";
  function b32(s){var buf=0,n=0,bytes=[];for(var i=0;i<s.length;i++){var v=AL.indexOf(s.charAt(i));if(v<0)throw new Error('bad');buf=((buf<<5)|v)&0xFFFF;n+=5;if(n>=8){bytes.push((buf>>(n-8))&255);n-=8;}}return new TextDecoder('utf-8').decode(new Uint8Array(bytes));}
  function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function money(t){var x=parseFloat(String(t).replace(/,/g,''));if(isNaN(x))return esc(t);return x.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+' <small>AED</small>';}
  function row(en,ar,val,cls,num){if(val===''||val==null)return '';return '<tr class="'+(cls||'')+'"><td class="k">'+en+'<span class="ar">'+ar+'</span></td><td class="v'+(num?' num':'')+'">'+(num?money(val):esc(val))+'</td></tr>';}
  function render(){
    var h=(location.hash||'').replace(/^#/,'');
    if(!h || h.indexOf('pc')!==0){out.innerHTML='<div class="empty"><b>Scan a RADCO payment certificate QR code</b>امسح رمز QR الموجود على شهادة الدفع لعرض بياناتها</div>';return;}
    var f;
    try{f=b32(h.slice(2)).split('\u001f');}catch(e){out.innerHTML='<div class="empty err"><b>Invalid QR code</b>رمز غير صالح أو غير مكتمل</div>';return;}
    var g=function(i){return f[i]===undefined?'':f[i];};
    var deds=parseFloat(g(14))||0;
    var html='<div class="badge"><b>✓ Data read from certificate QR code</b></div>';
    html+='<div class="sec"><span>Certificate</span><span>الشهادة</span></div><table>'+
      row('Payment No.','رقم الدفعة',g(1))+row('Certificate Date','تاريخ الشهادة',g(2))+
      row('Project','المشروع',g(3))+row('LPO No.','رقم أمر الشراء',g(4))+'</table>';
    html+='<div class="sec"><span>Supplier</span><span>المورد</span></div><table>'+
      row('Supplier Name','اسم المورد',g(5))+row('Supplier TRN','الرقم الضريبي للمورد',g(6))+
      row('Supplier Code (Al-Ameen)','كود المورد في الأمين',g(7))+
      row('Invoice No.','رقم الفاتورة',g(8))+row('Invoice Date','تاريخ الفاتورة',g(9))+'</table>';
    html+='<div class="sec"><span>Customer</span><span>الزبون</span></div><table>'+
      row('Customer','الزبون',g(16)||'RADCO Roads & General Contracting L.L.C.')+row('Customer TRN','الرقم الضريبي للزبون',g(17))+'</table>';
    html+='<div class="sec"><span>Amounts</span><span>المبالغ</span></div><table>'+
      row('Amount excl. VAT','المبلغ قبل الضريبة',g(10),'',1)+
      row('VAT '+esc(g(11)),'ضريبة القيمة المضافة',g(12),'',1)+
      row('Total incl. VAT','الإجمالي شامل الضريبة',g(13),'total',1)+
      (deds?row('Deductions','الخصومات',g(14),'',1):'')+
      row('Net Amount Payable','صافي المبلغ المستحق للدفع',g(15),'net',1)+'</table>';
    html+='<button class="copy" id="cp">Copy details / نسخ البيانات</button><div class="note">RADCO Roads &amp; General Contracting L.L.C. — Accounts Department</div>';
    out.innerHTML=html;
    document.getElementById('cp').onclick=function(){
      var lab=['','PC No','Date','Project','LPO','Supplier','Supplier TRN','Al-Ameen Code','Invoice No','Invoice Date','Amount excl. VAT','VAT %','VAT','Total incl. VAT','Deductions','Net Payable','Customer','Customer TRN'];
      var t=[];for(var i=1;i<lab.length;i++){if(g(i)!=='')t.push(lab[i]+': '+g(i));}
      var b=this;try{navigator.clipboard.writeText(t.join('\n')).then(function(){b.textContent='Copied ✓ / تم النسخ';},function(){b.textContent='Copy not allowed';});}catch(e){b.textContent='Copy not allowed';}
    };
  }
  render(); window.addEventListener('hashchange',render);
})();
</script>
